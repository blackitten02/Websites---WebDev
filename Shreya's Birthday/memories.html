<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Memories · Shreya's Birthday 📸</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Quicksand:wght@400;500;600;700&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="page-memories">
  <canvas id="fx" aria-hidden="true"></canvas>

  <!-- shared music pill -->
  <div id="music" class="music hidden" aria-live="polite">
    <button id="music-toggle" class="music__toggle" aria-label="Play / pause music">❚❚</button>
    <div class="music__meta">
      <span class="music__label">now playing</span>
      <span id="song-name" class="music__name">—</span>
    </div>
    <div id="playlist" class="playlist" hidden>
      <p class="playlist__title">our little soundtrack 🎧</p>
      <ul id="playlist-list" class="playlist__list"></ul>
    </div>
  </div>

  <!-- top navigation (every sub-page) -->
  <header class="topbar">
    <a class="topbar__brand" href="index.html">Shreya ✨</a>
    <nav class="topnav" aria-label="Sections">
      <a href="memories.html">Memories</a>
      <a href="letter.html">Letter</a>
      <a href="lyrics.html">hehehe</a>
      <a href="fun.html">Fun</a>
      <a href="ending.html">Ending</a>
    </nav>
  </header>

  <main class="page">
    <header class="section-head reveal">
      <p class="section-head__kicker">chapter one</p>
      <h2 class="section-head__title">a box of <em>little</em> memories</h2>
      <p class="section-head__note">every single one of these is my favorite. tap a photo to see it bigger 🤍</p>
    </header>

    <div class="scrapbook">
      <!-- 📸 Edit captions; duplicate a <figure> to add more photos -->
      <figure class="polaroid reveal" style="--rot:-5deg; --d:0.05s"><img src="images/shreya_03.jpeg" alt="Memory" loading="lazy" /><figcaption>the day we met 🌷</figcaption></figure>
      <figure class="polaroid polaroid--tall reveal" style="--rot:3deg; --d:0.12s"><img src="images/shreya_04.jpeg" alt="Memory" loading="lazy" /><figcaption>golden hour, always</figcaption></figure>
      <figure class="polaroid reveal" style="--rot:-2deg; --d:0.18s"><img src="images/shreya_06.jpeg" alt="Memory" loading="lazy" /><figcaption>your laugh &gt; everything</figcaption></figure>
      <figure class="polaroid polaroid--note reveal" style="--rot:4deg; --d:0.05s"><p>remember when we said we'd never grow up? 🤭</p></figure>
      <figure class="polaroid reveal" style="--rot:6deg; --d:0.22s"><img src="images/shreya_07.jpeg" alt="Memory" loading="lazy" /><figcaption>unbothered. happy. you.</figcaption></figure>
      <figure class="polaroid polaroid--tall reveal" style="--rot:-4deg; --d:0.1s"><img src="images/shreya_08.jpeg" alt="Memory" loading="lazy" /><figcaption>that one trip ✈️</figcaption></figure>
      <figure class="polaroid reveal" style="--rot:2deg; --d:0.28s"><img src="images/shreya_09.jpeg" alt="Memory" loading="lazy" /><figcaption>third-wheel energy 😎</figcaption></figure>
      <figure class="polaroid reveal" style="--rot:-6deg; --d:0.15s"><img src="images/shreya_10.jpeg" alt="Memory" loading="lazy" /><figcaption>my favorite human</figcaption></figure>
      <figure class="polaroid polaroid--note reveal" style="--rot:-3deg; --d:0.1s"><p>soft launch of our friendship 💌</p></figure>
      <figure class="polaroid polaroid--tall reveal" style="--rot:5deg; --d:0.2s"><img src="images/shreya_12.jpeg" alt="Memory" loading="lazy" /><figcaption>home is wherever you are</figcaption></figure>
      <figure class="polaroid reveal" style="--rot:-3deg; --d:0.25s"><img src="images/shreya_13.jpeg" alt="Memory" loading="lazy" /><figcaption>chaos, but make it cute</figcaption></figure>
      <figure class="polaroid reveal" style="--rot:4deg; --d:0.3s"><img src="images/shreya_14.jpeg" alt="Memory" loading="lazy" /><figcaption>still my favorite</figcaption></figure>
    </div>
  </main>

  <!-- lightbox -->
  <div id="lightbox" class="lightbox" aria-hidden="true">
    <img src="" alt="Enlarged memory" />
    <figcaption></figcaption>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
